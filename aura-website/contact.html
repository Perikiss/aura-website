<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact AURA</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header id="main-header">
    <h1>AURA</h1>
    <nav>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="collection.html">Collection</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="page-title">
        <h2>Contact Us</h2>
        <p>Have a question? Send us a message.</p>
    </section>

    <section class="contact-section">
        <img src="https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=900&q=80" alt="Skincare products on a table">

        <form id="contact-form">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="product">Favorite product</label>
            <select id="product" name="product">
                <option value="cream">Daily Cream</option>
                <option value="serum">Glow Serum</option>
                <option value="cleanser">Soft Cleanser</option>
            </select>

            <label for="color">Choose a color</label>
            <input type="color" id="color" name="color">

            <p>Would you like to receive news?</p>
            <label><input type="radio" name="news" value="yes"> Yes</label>
            <label><input type="radio" name="news" value="no"> No</label>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>
</main>

<footer>
    <p>Created by Perizat and Adema | AURA Skincare</p>
</footer>
</body>
</html>
