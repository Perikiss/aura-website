<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact AURA</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    
</head>
<div class="aura-loader" id="aura-loader" aria-label="Loading AURA" role="status">
    <div class="loader-flower" aria-hidden="true">✿</div>
    <div class="loader-wordmark">AURA</div>
    <p>Little moments of glow</p>
    <div class="loader-line"><span></span></div>
</div>

<header id="main-header">
    <h1>AURA</h1>
    <nav aria-label="Main navigation">
        <ul class="nav-menu">
            <li><a href="index.html" data-i18n="navHome">Home</a></li>
            <li><a href="about.html" data-i18n="navAbout">About</a></li>
            <li><a href="collection.html" data-i18n="navCollection">Collection</a></li>
            <li><a href="contact.html" data-i18n="navContact">Contact</a></li>
        </ul>
    </nav>
</header>
<aside class="site-tools" aria-label="Website tools">
        <label class="language-label" for="language-select" data-i18n="languageLabel">Language</label>
        <select id="language-select" aria-label="Choose language">
            <option value="en">EN</option><option value="ru">RU</option><option value="kk">KZ</option>
        </select>
        <button type="button" id="theme-toggle" class="tool-button" data-i18n="themeButton">Day / Night</button>
        <button type="button" id="color-btn" class="tool-button" data-i18n="colorButton">Change background</button>
        <button type="button" id="show-time-btn" class="tool-button" data-i18n="timeButton">Show time</button>
        <button type="button" id="play-sound-btn" class="tool-button" data-i18n="soundButton">Play sound</button>
        <output id="current-time" class="time-output" aria-live="polite"></output>
</aside>
<main>
    <section class="page-title reveal-on-scroll">
        <h2 data-i18n="contactTitle">Contact Us</h2>
        <p data-i18n="contactSubtitle">Have a question? Send us a message.</p>
    </section>
    <section class="contact-section reveal-on-scroll">
        <img src="https://images.unsplash.com/photo-1608248543803-ba4f8c70ae0b?w=900&q=80" alt="Skincare products on a table">
        <form id="contact-form">
            <h2 data-i18n="contactFormTitle">Send us a message</h2>
            <label for="name" data-i18n="nameLabel">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
            <label for="email" data-i18n="emailLabel">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            <label for="product" data-i18n="favoriteProduct">Favorite product</label>
            <select id="product" name="product">
                <option value="cream">Daily Cream</option><option value="serum">Glow Serum</option><option value="cleanser">Soft Cleanser</option>
            </select>
            <label for="color" data-i18n="chooseColor">Choose a color</label>
            <input type="color" id="color" name="color" value="#c98f80">
            <fieldset class="news-options">
                <legend data-i18n="newsQuestion">Would you like to receive news?</legend>
                <label><input type="radio" name="news" value="yes"> <span data-i18n="yesLabel">Yes</span></label>
                <label><input type="radio" name="news" value="no"> <span data-i18n="noLabel">No</span></label>
            </fieldset>
            <label for="message" data-i18n="messageLabel">Message</label>
            <textarea id="message" name="message" rows="5" placeholder="Write your message here..."></textarea>
            <div class="form-actions">
                <button type="submit" data-i18n="sendMessage">Send Message</button>
                <button type="button" id="reset-form-btn" class="secondary-button" data-i18n="resetForm">Reset form</button>
            </div>
            <p id="form-status" class="status-message" role="status" aria-live="polite"></p>
            <p class="form-note" data-i18n="formDemoNote">Demo form: this assignment shows a success message but does not send data to a real server.</p>
        </form>
    </section>
</main>
<footer>
    <p>Perizat and Adema</p>
</footer>
</body>
</html>
